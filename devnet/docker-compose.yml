x-wsc-environment: &wsc-environment
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  WSC_ETHEREUM_NETWORK: "${WSC_ETHEREUM_NETWORK:-sepolia}"
  WSC_ETHEREUM_RPC_URL: "${WSC_ETHEREUM_RPC_URL:-}"
  WSC_ETHEREUM_BRIDGE_CONTRACT: "${WSC_ETHEREUM_BRIDGE_CONTRACT:-}"
  WSC_ETHEREUM_DEPOSIT_TOPIC: "${WSC_ETHEREUM_DEPOSIT_TOPIC:-}"
  WSC_ETHEREUM_CONFIRMATIONS: "${WSC_ETHEREUM_CONFIRMATIONS:-12}"
  WSC_ETHEREUM_USDC_TOKEN: "${WSC_ETHEREUM_USDC_TOKEN:-}"
  WSC_ETHEREUM_USDC_BRIDGE_CONTRACT: "${WSC_ETHEREUM_USDC_BRIDGE_CONTRACT:-}"
  WSC_ETHEREUM_USDC_DEPOSIT_TOPIC: "${WSC_ETHEREUM_USDC_DEPOSIT_TOPIC:-}"
  WSC_USDC_ASSET_ID: "${WSC_USDC_ASSET_ID:-}"
  WSC_USDC_MNA_RATE_MNA_PER_USDC: "${WSC_USDC_MNA_RATE_MNA_PER_USDC:-}"
  WSC_MNA_BRIDGE_ENABLED: "${WSC_MNA_BRIDGE_ENABLED:-false}"
  WSC_MNA_RESERVE_USDC_MICRO: "${WSC_MNA_RESERVE_USDC_MICRO:-0}"
  WSC_MNA_FLOOR_USDC_MICRO_PER_MNA: "${WSC_MNA_FLOOR_USDC_MICRO_PER_MNA:-0}"
  WSC_MNA_ISSUANCE_CAP_MICRO: "${WSC_MNA_ISSUANCE_CAP_MICRO:-0}"
  WSC_SOLANA_NETWORK: "${WSC_SOLANA_NETWORK:-devnet}"
  WSC_SOLANA_RPC_URL: "${WSC_SOLANA_RPC_URL:-}"
  WSC_SOLANA_MODE: "${WSC_SOLANA_MODE:-disabled}"
  WSC_SOLANA_VAULT_ADDRESS: "${WSC_SOLANA_VAULT_ADDRESS:-}"
  WSC_SOLANA_VAULT_KEYPAIR: "${WSC_SOLANA_VAULT_KEYPAIR:-}"
  WSC_SOLANA_BRIDGE_PROGRAM: "${WSC_SOLANA_BRIDGE_PROGRAM:-}"
  WSC_SOLANA_PROGRAM_ID: "${WSC_SOLANA_PROGRAM_ID:-}"
  WSC_SOLANA_STATE_ADDRESS: "${WSC_SOLANA_STATE_ADDRESS:-}"
  WSC_SOLANA_PROGRAM_AUTHORITY_KEYPAIR: "${WSC_SOLANA_PROGRAM_AUTHORITY_KEYPAIR:-}"
  WSC_SOLANA_CLIENT_BIN: "${WSC_SOLANA_CLIENT_BIN:-/usr/local/bin/intertrain-wsol-client}"
  WSC_SOLANA_WSOL_MINT: "${WSC_SOLANA_WSOL_MINT:-}"
  WSC_SOLANA_SPL_USDC_MINT: "${WSC_SOLANA_SPL_USDC_MINT:-}"
  WSC_SOLANA_SPL_USDC_VAULT_TOKEN_ACCOUNT: "${WSC_SOLANA_SPL_USDC_VAULT_TOKEN_ACCOUNT:-}"
  WSC_SOLANA_COMMITMENT: "${WSC_SOLANA_COMMITMENT:-finalized}"
  WSC_SOLANA_CONFIRMATIONS: "${WSC_SOLANA_CONFIRMATIONS:-32}"
  WSC_SOL_MNA_PRICE_USD_MICRO_PER_SOL: "${WSC_SOL_MNA_PRICE_USD_MICRO_PER_SOL:-0}"
  WSC_SOL_MNA_FEE_BPS: "${WSC_SOL_MNA_FEE_BPS:-50}"
  WSC_SOLANA_MNA_ASSET_ID: "${WSC_SOLANA_MNA_ASSET_ID:-solana:SOL:devnet:native}"
  WSC_SOLANA_MNA_ORACLE_MAX_AGE: "${WSC_SOLANA_MNA_ORACLE_MAX_AGE:-120}"
  WSC_WSOL_ASSET_ID: "${WSC_WSOL_ASSET_ID:-}"
  WSC_BRIDGE_OPERATOR_TOKEN: "${WSC_BRIDGE_OPERATOR_TOKEN:-}"
  WSC_WETH_ASSET_ID: "${WSC_WETH_ASSET_ID:-ethereum:WETH:sepolia:bridge-placeholder}"

x-wsc: &wsc
  build:
    context: ..
    target: builder
  working_dir: /app
  volumes:
    - ..:/app
    - devnet-cargo-registry:/usr/local/cargo/registry
    - devnet-cargo-git:/usr/local/cargo/git
    - devnet-target:/app/target
  environment: *wsc-environment

services:
  init:
    <<: *wsc
    command: cargo run --package wsc -- devnet init --root /app/devnet/data
    restart: "no"

  node1:
    <<: *wsc
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *wsc-environment
      WSC_VALIDATOR_1: "0101010101010101010101010101010101010101010101010101010101010101"
    ports:
      - "26657:26657"
      - "26656:26656"
    command: >-
      cargo run --package wsc -- node start
      --data-dir /app/devnet/data/node-1
      --rpc-bind 0.0.0.0:26657
      --p2p-bind 0.0.0.0:26656
      --peer node2:26656 --peer node3:26656 --peer node4:26656
      --node-id validator-1 --validator-secret-env WSC_VALIDATOR_1

  node2:
    <<: *wsc
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *wsc-environment
      WSC_VALIDATOR_2: "0202020202020202020202020202020202020202020202020202020202020202"
    ports:
      - "26658:26657"
      - "26757:26656"
    command: >-
      cargo run --package wsc -- node start
      --data-dir /app/devnet/data/node-2
      --rpc-bind 0.0.0.0:26657
      --p2p-bind 0.0.0.0:26656
      --peer node1:26656 --peer node3:26656 --peer node4:26656
      --node-id validator-2 --validator-secret-env WSC_VALIDATOR_2

  node3:
    <<: *wsc
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *wsc-environment
      WSC_VALIDATOR_3: "0303030303030303030303030303030303030303030303030303030303030303"
    ports:
      - "26659:26657"
      - "26758:26656"
    command: >-
      cargo run --package wsc -- node start
      --data-dir /app/devnet/data/node-3
      --rpc-bind 0.0.0.0:26657
      --p2p-bind 0.0.0.0:26656
      --peer node1:26656 --peer node2:26656 --peer node4:26656
      --node-id validator-3 --validator-secret-env WSC_VALIDATOR_3

  node4:
    <<: *wsc
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *wsc-environment
      WSC_VALIDATOR_4: "0404040404040404040404040404040404040404040404040404040404040404"
    ports:
      - "26660:26657"
      - "26759:26656"
    command: >-
      cargo run --package wsc -- node start
      --data-dir /app/devnet/data/node-4
      --rpc-bind 0.0.0.0:26657
      --p2p-bind 0.0.0.0:26656
      --peer node1:26656 --peer node2:26656 --peer node3:26656
      --node-id validator-4 --validator-secret-env WSC_VALIDATOR_4

volumes:
  devnet-cargo-registry:
  devnet-cargo-git:
  devnet-target:
